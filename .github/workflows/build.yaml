name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "main"
      - "v2"
  pull_request:
    branches:
      - "main"
      - "v2"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-2025
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-26
            rid: osx-arm64
          - os: macos-26-intel
            rid: osx-x64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@758ef555e15e5d390a495fee02a8e31ec8141293 # v1.1.0
        with:
          restore-wasm-workload: true
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Build
        run: dotnet build -c Release
      # Same step release.yaml runs before packing, so a break shows up on the PR that caused it.
      - name: Trim XML documentation to the public surface
        shell: bash
        run: dotnet run tools/filter_public_docs.cs -- src/FeatherQR/bin/Release/*/FeatherQR.xml src/FeatherQR.SkiaSharp/bin/Release/*/FeatherQR.SkiaSharp.xml
      # The surface that ships is the one that was reviewed. A release built from a branch that never went through the PR gate would otherwise be the one way past it.
      - name: Check the public API against the approved listing
        if: ${{ matrix.rid == 'linux-x64' }}
        shell: bash
        run: |
          dotnet run tools/check_public_api.cs -- --check src/FeatherQR/PublicAPI.approved.txt src/FeatherQR/bin/Release/*/FeatherQR.dll
          dotnet run tools/check_public_api.cs -- --check src/FeatherQR.SkiaSharp/PublicAPI.approved.txt src/FeatherQR.SkiaSharp/bin/Release/*/FeatherQR.SkiaSharp.dll
      # Package validation (EnablePackageValidation) only runs on Pack, not on Build, so a PR
      # would otherwise never see it. One runner is enough: the comparison is against the
      # baseline package on NuGet and does not depend on the host OS. SBOM generation is off
      # because this pack exists to validate the API, not to produce a shippable package.
      - name: Validate package API compatibility
        if: ${{ matrix.rid == 'linux-x64' }}
        run: dotnet pack -c Release --no-build -o ./artifacts -p:GenerateSBOM=false
      # The split's artifact-level guard: the three nuspecs declare exactly the dependency graph the
      # plan fixes (core: BCL shims on netstandard only; rendering: FeatherQR + SkiaSharp; metapackage:
      # FeatherQR.SkiaSharp, no lib/). A stray PackageReference passes build and test and shows up here.
      - name: Check package dependencies
        if: ${{ matrix.rid == 'linux-x64' }}
        run: dotnet run tools/check_package_deps.cs -- ./artifacts
      - name: Test
        # skip output with multiple modules may stuck test
        run: dotnet test -c Release --no-build --max-parallel-test-modules 1 --timeout 8m
        env:
          # Cap TUnit parallelism to match typical GHA runner cores (avoids CPU-heavy QR/Skia tests oversubscribing).
          TUNIT_MAX_PARALLEL_TESTS: 4
        timeout-minutes: 10

  run:
    needs: [build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            ext: ""
          - os: windows-2025
            rid: win-x64
            ext: ".exe"
          - os: windows-11-arm
            rid: win-arm64
            ext: ".exe"
          - os: macos-26
            rid: osx-arm64
            ext: ""
          - os: macos-26-intel
            rid: osx-x64
            ext: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@758ef555e15e5d390a495fee02a8e31ec8141293 # v1.1.0
        with:
          dotnet-version: 10.0.x
      # ConsoleApp
      - name: Run ConsoleApp
        run: dotnet run -c Release -r ${{ matrix.rid }} -- --output-dir samples
        working-directory: ./samples/ConsoleApp
      # SimpleGenerate
      - name: Run SimpleGenerate
        run: dotnet run -c Release -r ${{ matrix.rid }}
        working-directory: ./samples/SimpleGenerate
      # NativeAOT
      - name: Run ConsoleAppNativeAOT
        shell: bash
        run: |
          dotnet publish ./samples/ConsoleAppNativeAOT/ConsoleAppNativeAOT.csproj -c Release -r ${{ matrix.rid }} -o ./publish/
          cd ./publish/
          ls -l
          chmod +x ConsoleAppNativeAOT${{ matrix.ext }}
          ./ConsoleAppNativeAOT${{ matrix.ext }}

  # Playground native relink (SkiaSharp + Emscripten) only happens on publish, so the
  # matrix `dotnet build` above stays managed-only. Verify the publish path on one leg.
  # AOT is disabled here for speed; the Deploy Playground workflow publishes with full AOT.
  build-playground:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@758ef555e15e5d390a495fee02a8e31ec8141293 # v1.1.0
        with:
          dotnet-version: 10.0
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools
      # No -r browser-wasm: it would propagate to the multi-targeted library reference
      # and require the wasm-tools-net8 workload; the WebAssembly SDK defaults the RID anyway.
      - name: Publish Playground (browser-wasm Release, no AOT)
        run: dotnet publish src/FeatherQR.Playground/FeatherQR.Playground.csproj -c Release -p:RunAOTCompilation=false -p:PlaygroundSoftFingerprint=true -o publish/playground/

  # NativeAOT compatibility gate and SIMD tier check. Publishing tests/FeatherQR.AotAnalysis roots
  # the whole library (TrimmerRootAssembly) so ILC analyzes every member, and fails on any trim/AOT
  # warning (TreatWarningsAsErrors in that csproj); that part needs one runner, since IL-level analysis
  # does not depend on the host OS. The binary then holds the SIMD tier each kernel takes in that build
  # to the table in src/FeatherQR/Internals/SimdTiers.cs (--simd-class) and its vector tiers to their scalar forms
  # on the code ILC emitted (--parity), so each leg is one build class:
  # the default x64 publish (no AVX), an x86-64-v3 publish, and the default publish on each ARM64 OS.
  # The JIT steps hold the JIT on the same runner to its class, and show the side of a class the runner's
  # CPU does not: the no-AVX dispatch on an AVX2 machine, and ARM64 without the dot product.
  aot-analysis:
    name: aot-analysis (${{ matrix.rid }}, ${{ matrix.simd-class }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            ext: ""
            ilc-instruction-set: ""
            simd-class: X64Sse
            jit-simd-class: X64Avx2
            jit-knob: DOTNET_EnableAVX=0
            jit-knob-simd-class: X64Sse
          - os: ubuntu-24.04
            rid: linux-x64
            ext: ""
            ilc-instruction-set: x86-64-v3
            simd-class: X64Avx2
            jit-simd-class: ""
            jit-knob: ""
            jit-knob-simd-class: ""
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            ext: ""
            ilc-instruction-set: ""
            simd-class: Arm64
            jit-simd-class: Arm64
            jit-knob: DOTNET_EnableArm64Dp=0
            jit-knob-simd-class: Arm64
          - os: windows-11-arm
            rid: win-arm64
            ext: ".exe"
            ilc-instruction-set: ""
            simd-class: Arm64
            jit-simd-class: Arm64
            jit-knob: DOTNET_EnableArm64Dp=0
            jit-knob-simd-class: Arm64
          - os: macos-26
            rid: osx-arm64
            ext: ""
            ilc-instruction-set: ""
            simd-class: Arm64
            jit-simd-class: Arm64
            jit-knob: DOTNET_EnableArm64Dp=0
            jit-knob-simd-class: Arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@758ef555e15e5d390a495fee02a8e31ec8141293 # v1.1.0
        with:
          dotnet-version: 10.0.x
      - name: Publish AOT analysis gate
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          ILC_INSTRUCTION_SET: ${{ matrix.ilc-instruction-set }}
        run: |
          args=(-c Release -r "$RID" -o publish/aot-analysis/)
          if [[ -n "$ILC_INSTRUCTION_SET" ]]; then
            args+=("-p:IlcInstructionSet=$ILC_INSTRUCTION_SET")
          fi
          dotnet publish tests/FeatherQR.AotAnalysis/FeatherQR.AotAnalysis.csproj "${args[@]}"
      - name: Run AOT analysis binary and check its SIMD tiers and their parity
        shell: bash
        env:
          EXT: ${{ matrix.ext }}
          SIMD_CLASS: ${{ matrix.simd-class }}
        run: ./publish/aot-analysis/FeatherQR.AotAnalysis"$EXT" --simd-class "$SIMD_CLASS" --parity
      - name: Check SIMD tiers under the JIT
        if: ${{ matrix.jit-simd-class != '' }}
        shell: bash
        env:
          JIT_SIMD_CLASS: ${{ matrix.jit-simd-class }}
          JIT_KNOB: ${{ matrix.jit-knob }}
          JIT_KNOB_SIMD_CLASS: ${{ matrix.jit-knob-simd-class }}
        run: |
          dotnet build tests/FeatherQR.AotAnalysis/FeatherQR.AotAnalysis.csproj -c Release
          dll=tests/FeatherQR.AotAnalysis/bin/Release/net10.0/FeatherQR.AotAnalysis.dll
          dotnet "$dll" --simd-class "$JIT_SIMD_CLASS"
          env "$JIT_KNOB" dotnet "$dll" --simd-class "$JIT_KNOB_SIMD_CLASS"

  # SIMD tier check for WebAssembly: tests/FeatherQR.WasmReport holds a WebAssembly build of the library to
  # the Wasm column of the table in src/FeatherQR/Internals/SimdTiers.cs and its vector tiers to their scalar forms
  # (--parity, the one run of the PackedSimd operations), headless under Node.js, which has
  # the WebAssembly SIMD a browser has. Interpreted is what a Blazor WebAssembly app runs by default; AOT-compiled
  # is what the Playground ships.
  wasm-simd:
    name: wasm-simd (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [interpreter, aot]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@758ef555e15e5d390a495fee02a8e31ec8141293 # v1.1.0
        with:
          dotnet-version: 10.0
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools
      - name: Publish the WebAssembly report
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          aot=false
          if [[ "$MODE" == "aot" ]]; then
            aot=true
          fi
          dotnet publish tests/FeatherQR.WasmReport/FeatherQR.WasmReport.csproj -c Release "-p:RunAOTCompilation=$aot" -o publish/wasm-report/
      - name: Run the WebAssembly report and check its SIMD tiers and their parity
        run: node publish/wasm-report/wwwroot/main.mjs --simd-class Wasm --parity

  build-complete:
    needs: [build, run, aot-analysis, build-playground, wasm-simd]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 1
    steps:
      - name: Build Complete
        run: echo "Build and Run completed successfully."
