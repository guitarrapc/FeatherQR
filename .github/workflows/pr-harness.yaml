name: PR Harness

on:
  pull_request:
    branches: [main]

jobs:
  harness:
    permissions:
      contents: read
      pull-requests: read
    uses: guitarrapc/actions/.github/workflows/pr-harness.yaml@b9e79bebea40ce159375351b13af8b3c0b530937 # v1.3.1
    with:
      license-check: true
      exclude-license-input-paths: "tools/"
